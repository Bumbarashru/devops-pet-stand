---
- name: Base dependency
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-docker
    state: present

- name: Create Dir for key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download GPG-key for Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Repository Docker
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Download Docker, Compose, Buildx
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start Docker in systemd
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Add users in groups docker
  ansible.builtin.user:
    name: "deploy"
    groups: docker
    append: yes

- name: Create dir for app
  ansible.builtin.file:
    path: /opt/secure-stand
    state: directory
    mode: 0755

- name: copy docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/secure-stand/docker-compose.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: copy nginx.conf
  ansible.builtin.copy:
    src: nginx.conf
    dest: /opt/secure-stand/nginx.conf
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: start servecis via Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/secure-stand
    state: present
    build: false




















