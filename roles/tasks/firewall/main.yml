---

- name: Flush Iptables
  ansible.builtin.iptables:
    chain: "{{ item }}"
    flush: true
  loop: ['INPUT', 'OUTPUT', 'FORWARD']

- name: ACCEPT established/related
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    action: append

- name: ACCEPT port ssh, http, https
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_ports:
      - "22"
      - "80"
      - "443"
    jump: ACCEPT
    action: append

- name: Set Policy Drop TO INPUT FORWARD
  ansible.builtin.iptables:
    chain: "{{item}}"
    police: DROP
  loop: ['INPUT', 'FORWARD']

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: yes

- name: Save iptables rules
  ansible.builtin.command:
    cmd: netfilter-persistent save
  changed_when: false
